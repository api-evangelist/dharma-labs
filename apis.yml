name: Dharma Labs
description: >-
  Dharma Labs was a decentralized-finance company that built Dharma Protocol, an
  open-source Ethereum protocol for tokenized debt and peer-to-peer lending, and
  later the Dharma non-custodial smart wallet. It was backed by Polychain and was
  acquired by OpenSea in 2021. The company is defunct: its developer surface at
  dharma.io is now a parked, for-sale domain with no live API, documentation, or
  well-known discovery endpoints. Real, first-party remnants still survive on the
  public registries — the GitHub organization dharmaprotocol (26 public repos,
  including the dharma.js client library, charta smart contracts, developer-docs,
  and the dapp-wallet) and the npm package @dharmaprotocol/dharma.js, which is
  published but explicitly marked DEPRECATED. This profile captures those honest
  historical artifacts; the provider ships no maintained API today.
